data:
  points_dir: "data/points/crop_20um/ds0p25"
  
  # WARNING: when visualizing, still need processed data.
  raw_A_dir: "data/raw/lightsheet_vol_6.9"
  raw_b_dir: "data/raw/20um_imgs"
  downsampling_rate: 0.25
  scale_factor: 8.0 # ratio of image scales to light-field
  
  crop_box_b: [1140, 830, 1652, 1342]
  crop_box_A: [5, 268, 18, 69, 332, 82]
  
  output_dir: "result/solve_point/svd_crop_20um_0p25"
  batch_pattern: "points_batch_*.pt"
  threshold_A: 0.4
  threshold_b: null

solver:
  type: "svd"
  lambda_reg: 1.0e-5
  n_iter: 1
  positivity: false # SVD doesn't handle positivity
  batch_size: 2000

device: "cuda"
mesh_iso: [4.0]
