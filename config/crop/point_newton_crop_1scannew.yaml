data:
  points_dir: "data/points/crop_1scannew/ds1p0"
    # WARNING: when visualizing, still need processed data.
  raw_A_dir: "data/raw/interp_512_189-218"
  raw_b_dir: "data/raw/1scan_cropped"
  downsampling_rate: 1.0
  scale_factor: 8.0
  
  crop_box_b: [0, 0, 512, 512]
  crop_box_A: [5, 268, 0, 69, 332, 64]


  output_dir: "result/solve_point/newton_crop_1scannew_1p0"
